        <img src="images/logo-lyric-map.png" alt="LyricMap Logo" class="logo-img" />
      </a>
    </div>
    <nav class="navbar">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
