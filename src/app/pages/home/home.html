<div class="home-viewport-container">
  <!-- Hero Overlay Section (Slides to the left to reveal map) -->
  <section class="hero" [class.collapsed]="isHeroCollapsed">
    <button class="hero-close-btn" (click)="toggleHero(true)" title="Explore Map View">
      <span>EXPLORE MAP</span>
      <span class="arrow-icon">&rarr;</span>
    </button>
    
    <div class="hero-content">
      <h1 class="hero-title">Discover the World Through Lyrics</h1>
      <p class="hero-subtitle">Interactive musical mapping experience connecting Greek rap to their geographical roots.</p>
      <button (click)="toggleHero(true)" class="cta-button">
        Explore the Map &rarr;
      </button>
    </div>
  </section>

  <!-- Floating Edge Toggle Tab (Allows reopening intro drawer anytime) -->
  <button class="hero-edge-toggle" [class.hero-hidden]="!isHeroCollapsed" (click)="toggleHero(false)" title="Discover LyricMap Info">
    <span class="icon">💡</span>
    <span class="label">DISCOVER</span>
  </button>

  <!-- Full Screen Map Container -->
  <section id="map-section" class="map-container">
    <div class="filter-controls">
      <div class="filter-header">
        <p class="map-description">Top {{ (totalSongs$ | async) || 20 }} songs by {{ (totalArtists$ | async) || 22 }} Greek Rap Artists</p>
        
        <div class="filter-actions">
          <button class="filter-toggle" (click)="toggleFilterDropdown()" [class.active]="isFilterOpen">
            <span class="icon">🔍</span>
            Filter by Artist
            <span class="count" *ngIf="selectedArtists.length > 0">{{selectedArtists.length}}</span>
          </button>
          <button class="clear-btn" *ngIf="selectedArtists.length > 0" (click)="clearFilters()">Reset</button>
        </div>
      </div>

      <div class="artist-dropdown-panel" *ngIf="isFilterOpen">
        <div class="artist-grid">
          <button 
            *ngFor="let artist of (artists$ | async)" 
            class="artist-tag" 
            [class.selected]="isArtistSelected(artist)"
            (click)="toggleArtist(artist)"
          >
            {{artist}}
          </button>
        </div>
      </div>
    </div>

    <div class="map-wrapper">
      <div id="map"></div>
    </div>
  </section>
</div>

<app-report-issue-modal 
  *ngIf="isReportModalOpen"
  [locationId]="reportLocationId"
  [locationName]="reportLocationName"
  (close)="closeReportModal()">
</app-report-issue-modal>
