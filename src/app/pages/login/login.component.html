<div class="login-container">
  <div class="login-card">
    <h1>Admin Login</h1>
    <p>Enter your credentials to manage locations.</p>
    
    <form (submit)="onSubmit($event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" [(ngModel)]="username" name="username" required placeholder="admin">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
      </div>
      
      <div class="error-message" *ngIf="error">
        {{ error }}
      </div>
      
      <button type="submit" [disabled]="loading">
        {{ loading ? 'Authenticating...' : 'Login' }}
      </button>
    </form>
  </div>
</div>
